name: validate-jizz-web

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/web/**"
      - "data/live/**"
      - "vercel.json"
      - ".github/workflows/web.yml"
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "data/live/**"
      - "vercel.json"
      - ".github/workflows/web.yml"

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run ci
